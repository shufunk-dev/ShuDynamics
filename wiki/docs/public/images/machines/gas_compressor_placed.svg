<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="50%" stop-color="#1A1C2B"/>
      <stop offset="100%" stop-color="#0E0F17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#262A40" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  
  <!-- Border -->
  <rect x="8" y="8" width="624" height="384" rx="12" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75"/>
  
  <!-- Center Box -->
  <g transform="translate(320, 200)">
    <!-- Camera Icon -->
    <rect x="-30" y="-70" width="60" height="44" rx="8" fill="#24283E" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="0" cy="-48" r="12" fill="#13141F" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="16" cy="-60" r="3" fill="#8B5CF6"/>
    
    <!-- Text Labels -->
    <text text-anchor="middle" y="5" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">Gas Compressor</text>
    <text text-anchor="middle" y="28" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Gas Pressurization & Tank Filling (3D Placed View)</text>
    
    <!-- Target Filename Pill -->
    <rect x="-160" y="44" width="320" height="28" rx="6" fill="#1E2235" stroke="#374151" stroke-width="1"/>
    <text text-anchor="middle" y="63" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">Drop file: gas_compressor_placed.png</text>
  </g>
</svg>