plugins {
    id 'fabric-loom' version '1.13.6'
    id 'maven-publish'
}











version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // EMI Recipe Viewer API
    modCompileOnly "dev.emi:emi-fabric:1.1.16+1.21.1:api"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename "LICENSE", "LICENSE_${project.base.archivesName.get()}"
    }
}

tasks.register('deployMod') {
    dependsOn remapJar
    doLast {
        def src = remapJar.archiveFile.get().asFile
        def targetDirs = [
            file("C:/Projects/Minecraft Mod/scratch/mods"),
            file("C:/Users/shufu/CurseForge/minecraft/Instances/My Mod/mods")
        ]
        targetDirs.each { dir ->
            if (!dir.exists()) dir.mkdirs()
            def dest = new File(dir, src.name)
            java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "DEPLOYED TO: " + dest.absolutePath + " (" + dest.length() + " bytes)"
        }
    }
}
