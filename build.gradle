plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    mavenCentral()
}

loom {
    runtimeOnlyLwjglGraphics = false
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // EMI Recipe Viewer API
    compileOnly files("C:/Users/shufu/curseforge/minecraft/Instances/Curios/mods/emi-1.1.24-2fb0d30+26.3+fabric.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

jar {
    from("LICENSE") {
        rename "LICENSE", "LICENSE_${project.base.archivesName.get()}"
    }
}

tasks.register('deployMod') {
    dependsOn jar
    doLast {
        def src = jar.archiveFile.get().asFile
        def targetDirs = [
            file("C:/Projects/Minecraft Mod/scratch/mods"),
            file("C:/Users/shufu/CurseForge/minecraft/Instances/Curios/mods")
        ]
        targetDirs.each { dir ->
            if (!dir.exists()) dir.mkdirs()
            def dest = new File(dir, src.name)
            java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "DEPLOYED TO: " + dest.absolutePath + " (" + dest.length() + " bytes)"
        }
    }
}

